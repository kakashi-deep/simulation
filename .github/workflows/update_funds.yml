name: TEFAS Fon Verisini Güncelle

on:
  schedule:
    # 06:30 ve 18:30 (UTC) - Türkiye saatiyle 09:30 ve 21:30 civarı
    - cron: '30 6 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # ← YENİ: workflow run silmek için gerekli

jobs:
  update-funds:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: TEFAS verisini çek
        run: python fetch_funds.py

      - name: Değişiklik varsa commit ve push yap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funds.json data/history.json
          git diff --staged --quiet || git commit -m "chore: TEFAS fon verisini güncelle"
          git push

      - name: Eski workflow çalışmalarını temizle (son 10'u koru)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Eski workflow çalışmaları temizleniyor..."

          # Bu workflow'un tüm çalışmalarını listele (en yeni en üstte)
          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          if [ -z "$runs" ]; then
            echo "Listelenecek çalışma bulunamadı."
            exit 0
          fi

          total=$(echo "$runs" | wc -l | tr -d ' ')
          echo "Toplam $total çalışma bulundu."

          if [ "$total" -le 10 ]; then
            echo "10 veya daha az çalışma var, silme yapılmadı."
            exit 0
          fi

          # İlk 10'u koru, geri kalanı sil
          count=0
          deleted=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -le 10 ]; then
              continue
            fi
            echo "  → Siliniyor: run #$run_id ($count/$total)"
            if gh run delete "$run_id" 2>/dev/null; then
              deleted=$((deleted + 1))
            else
              echo "    atlandı (silinemedi)"
            fi
          done

          echo "✅ Temizlik tamam: $deleted çalışma silindi, son 10 korundu."
